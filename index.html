<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;font-family:system-ui}
body{background:#0f0f0f;color:#fff;display:flex;justify-content:center;padding:20px}
.box{width:100%;max-width:500px;background:#1a1a1a;padding:20px;border-radius:16px}
h2{margin:0 0 15px}
input,select{width:100%;padding:12px;border-radius:10px;border:0;background:#2a2a2a;color:#fff;margin-bottom:12px;outline:none}
.row{display:flex;gap:10px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#6c5cff;color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin-top:8px}
button:disabled{opacity:.5}
.btn2{background:#2a2a2a}
#result{margin-top:20px;display:none}
video{width:100%;border-radius:12px;background:#000;max-height:70vh}
#log{font-size:11px;color:#888;margin-top:10px;word-break:break-all;background:#111;padding:8px;border-radius:8px}
</style>
</head>
<body>
<div class="box">
  <h2>Txt2Video - OmegaTech</h2>
  <input id="prompt" placeholder="A cow in city" value="A cow in city">
  <div class="row">
    <select id="ratio">
      <option value="auto" selected>auto</option>
      <option value="16:9">16:9</option>
      <option value="9:16">9:16</option>
      <option value="1:1">1:1</option>
    </select>
    <select id="sound">
      <option value="true" selected>Sound ON</option>
      <option value="false">Sound OFF</option>
    </select>
  </div>
  <button id="btn" onclick="generate()">Generate Video</button>

  <div id="result">
    <video id="vid" controls autoplay loop playsinline></video>
    <button class="btn2" id="downloadBtn" onclick="downloadVideo()">⬇ Download Video</button>
    <button class="btn2" onclick="copyLink()">Copy Link</button>
    <div id="log"></div>
  </div>
</div>

<script>
let currentVideoUrl = '';

async function generate(){
  const prompt = document.getElementById('prompt').value.trim();
  const ratio = document.getElementById('ratio').value;
  const sound = document.getElementById('sound').value;
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');
  const result = document.getElementById('result');
  const vid = document.getElementById('vid');

  if(!prompt){alert('Enter prompt');return;}
  btn.disabled=true; btn.textContent='Generating...';
  log.textContent='Requesting...'; result.style.display='block';

  const url = `https://api.omegatech.app/api/ai/Txt2video?action=generate&prompt=${encodeURIComponent(prompt)}&ratio=${ratio}&sound=${sound}`;

  try{
    const res = await fetch(url);
    const json = await res.json();
    
    if(json.success && json.data && json.data.videoUrl){
      currentVideoUrl = json.data.videoUrl;
      vid.src = currentVideoUrl;
      vid.load();
      log.textContent = `Prompt: ${json.data.prompt}\nURL: ${currentVideoUrl}`;
    }else{
      log.textContent = JSON.stringify(json,null,2);
    }
  }catch(e){
    log.textContent = 'Error: ' + e.message;
  }finally{
    btn.disabled=false; btn.textContent='Generate Video';
  }
}

function downloadVideo(){
  if(!currentVideoUrl) return;
  const a = document.createElement('a');
  a.href = currentVideoUrl;
  a.download = `quetta-${Date.now()}.mp4`;
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function copyLink(){
  if(!currentVideoUrl) return;
  navigator.clipboard.writeText(currentVideoUrl);
  alert('Link copied!');
}
</script>
</body>
                             </html>
